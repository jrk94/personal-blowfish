{{ $url := .Get "src" }}
{{ $height := .Get "height" | default "500px" }}
{{ $width := .Get "width" | default "100%" }}
{{ $title := .Get "title" | default "Embedded content" }}
{{ $zoom := .Get "zoom" | default "1" }}
{{ $id := .Ordinal }}
<div class="not-prose">
  <!-- Inline preview -->
  <div style="position:relative; width:{{ $width }}; height:{{ $height }}; border-radius:0.5rem; overflow:hidden;">
    <iframe
      src="{{ $url | safeURL }}"
      title="{{ $title }}"
      style="border:none; display:block; width:100%; height:100%; zoom:{{ $zoom }};"
      loading="lazy"
    ></iframe>
    <!-- Fullscreen button -->
    <button
      onclick="document.getElementById('iframe-modal-{{ $id }}').classList.remove('invisible')"
      title="Open fullscreen"
      style="position:absolute; bottom:0.5rem; right:0.5rem; display:flex; align-items:center; gap:0.3rem; padding:0.3rem 0.6rem; border-radius:0.375rem; border:none; cursor:pointer; font-size:0.75rem; font-weight:600; background:rgba(0,0,0,0.55); color:#fff; backdrop-filter:blur(4px);"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:1em;height:1em;"><path fill-rule="evenodd" d="M15 3a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 1 1-2 0V5.414l-4.293 4.293a1 1 0 0 1-1.414-1.414L18.586 4H16a1 1 0 0 1-1-1ZM3 9a1 1 0 0 1 1 1v2.586l4.293-4.293a1 1 0 0 1 1.414 1.414L5.414 14H8a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1Z" clip-rule="evenodd"/><path fill-rule="evenodd" d="M3 15a1 1 0 0 1 1 1v2.586l4.293-4.293a1 1 0 1 1 1.414 1.414L5.414 18H8a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1ZM21 3a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0V5.414l-4.293 4.293a1 1 0 0 1-1.414-1.414L18.586 4H16a1 1 0 0 1-1-1Z" clip-rule="evenodd"/></svg>
      Fullscreen
    </button>
  </div>

  <!-- Modal overlay -->
  <div
    id="iframe-modal-{{ $id }}"
    class="invisible"
    onclick="if(event.target===this)this.classList.add('invisible')"
    style="position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(64,64,64,0.6); backdrop-filter:blur(4px); padding:1.5rem;"
  >
    <div style="position:relative; width:100%; height:100%; max-width:1400px; border-radius:0.5rem; overflow:hidden; box-shadow:0 25px 50px rgba(0,0,0,0.4);">
      <!-- Close button -->
      <button
        onclick="document.getElementById('iframe-modal-{{ $id }}').classList.add('invisible')"
        title="Close"
        style="position:absolute; top:0.5rem; right:0.5rem; z-index:10; display:flex; align-items:center; justify-content:center; width:2rem; height:2rem; border-radius:9999px; border:none; cursor:pointer; background:rgba(0,0,0,0.55); color:#fff; backdrop-filter:blur(4px);"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:1em;height:1em;"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/></svg>
      </button>
      <iframe
        src="{{ $url | safeURL }}"
        title="{{ $title }}"
        style="border:none; display:block; width:100%; height:100%;"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</div>

<script>
(function() {
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var m = document.getElementById('iframe-modal-{{ $id }}');
      if (m) m.classList.add('invisible');
    }
  });
})();
</script>
